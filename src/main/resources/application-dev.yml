spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: root
    password: password
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    find-and-add-modules: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    properties:
      mail:
        smtp:
          starttls:
            enable: 'true'
          auth: 'true'
    host: smtp.example.com
    username: your-username
    password: your-password
    port: '587'
app:
  jwt:
    secret: 0uC9dpSqePgOQA3hvRvoTCUJgly1iOqkPoImkCGxVeVKku9nSih3gner8w1IvfhUaIEGjhSZRQdle5zDsRU4Xz
    access-token-expiration-ms: 86400000
    refresh-token-expiration-ms: 86400000

openapi:
  service:
    api-docs: api-service
    server: http://localhost:8080
    title: API Service
    version: 1.0.0


